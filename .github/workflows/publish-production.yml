name: Publish Hostinger Production Branch

on:
  push:
    branches: [main]
    paths:
      - "hostinger-release/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/publish-production.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build production files
        run: |
          npm install --ignore-scripts
          npx vite build --outDir hostinger-release --emptyOutDir false
      - name: Publish Hostinger release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hostinger-release
          git diff --cached --quiet || git commit -m "build: update Hostinger production assets"
          test -f hostinger-release/index.php
          test -f hostinger-release/.htaccess
          git branch -D production-build 2>/dev/null || true
          git subtree split --prefix=hostinger-release -b production-build
          git push origin production-build:production
